<style>
:root{--vino:#550e1f;--vino-2:#3f0a17;--oro:#d4a45f;--oro-2:#ebd7ba;--papel:#fbfaf6;--ink:#141012;--mute:#6f6168}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:68px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{font-family:Poppins,system-ui,sans-serif;font-weight:300;color:var(--ink);background:var(--papel);-webkit-font-smoothing:antialiased;overflow-x:hidden}
.wrap{max-width:980px;margin:0 auto;padding:0 20px}

/* ---------- portada ---------- */
.hero{background:var(--vino);padding:clamp(16px,4vw,34px)}
.hero .marco{border:1px solid var(--oro);outline:1px solid var(--oro);outline-offset:-9px;padding:clamp(40px,12vw,96px) 20px}
.hero img{display:block;width:min(360px,76vw);height:auto;margin:0 auto}

/* ---------- nav ---------- */
.nav{position:sticky;top:0;z-index:20;background:var(--vino);border-bottom:2px solid var(--oro)}
.nav ul{display:flex;gap:6px;overflow-x:auto;list-style:none;padding:10px 16px;max-width:980px;margin:0 auto;scrollbar-width:none}
.nav ul::-webkit-scrollbar{display:none}
.nav a{display:block;white-space:nowrap;padding:6px 14px;border:1px solid var(--oro);border-radius:999px;color:var(--oro-2);text-decoration:none;font-weight:400;font-size:.8rem;letter-spacing:.03em}
.nav a[aria-current="true"]{background:var(--oro);border-color:var(--oro);color:var(--vino);font-weight:500}

/* ---------- secciones ---------- */
main{padding-bottom:8px}
.sec{padding:34px 0 8px}
.orn{display:block;width:min(300px,70%);height:auto;margin:0 auto 18px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:70px}
.sec-h h2{font-family:'Great Vibes',cursive;font-weight:400;color:var(--vino);font-size:clamp(2.6rem,11vw,3.6rem);line-height:1.1}
.sec-h img.ic{height:clamp(70px,20vw,110px);width:auto;flex:none}
.note{margin-top:6px;font-style:italic;font-size:.88rem;color:var(--mute)}
.cols{columns:2 400px;column-gap:56px;margin-top:14px}
.grp{break-inside:avoid;margin-bottom:26px}
.grp>h3{font-family:'Great Vibes',cursive;font-weight:400;color:var(--vino);font-size:clamp(1.9rem,7vw,2.3rem);line-height:1.15;margin-bottom:2px}
.grp>h3 small{font-family:Poppins;font-size:.8rem;font-style:italic;color:var(--mute)}
.items{list-style:none}
.it{display:grid;grid-template-columns:1fr auto;gap:1px 16px;padding:10px 0;border-bottom:1px solid var(--oro-2)}
.it:last-child{border-bottom:0}
.it h4{font-weight:400;font-size:1rem;line-height:1.3}
.it h4 small{font-weight:300;font-size:.8rem;color:var(--mute)}
.it .pr{font-weight:700;font-style:italic;white-space:nowrap;text-align:right;line-height:1.3}
.it .pr small{display:block;font-weight:300;font-size:.68rem;letter-spacing:.04em;color:var(--mute)}
.it p{grid-column:1/-1;font-style:italic;font-size:.84rem;line-height:1.5;color:#3c3237}
.it p.q{color:var(--mute)}
.ask{font-weight:300;font-style:italic;font-size:.85rem;color:var(--mute)}

/* ---------- cierre ---------- */
.cierre{margin-top:34px;background:var(--vino);padding:clamp(16px,4vw,34px)}
.cierre .marco{border:1px solid var(--oro);outline:1px solid var(--oro);outline-offset:-9px;padding:44px 20px;text-align:center}
.cierre img{display:block;width:min(260px,64vw);height:auto;margin:0 auto 26px}
.cierre ul{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 36px;list-style:none}
.cierre a{display:inline-flex;align-items:center;gap:9px;color:var(--oro);text-decoration:none;font-style:italic;font-size:1.02rem}
.cierre svg{width:22px;height:22px;flex:none}
</style>

  ]},
 ]},
 {id: 'postres', t: 'Postres', img: 'flan', groups: [
  {items: [
   {n: 'Ensalada de frutas', p: 12000}, {n: 'Flan', p: 7000}, {n: 'Budín de pan', p: 7000}, {n: 'Bombón helado', p: 8600},
   {n: 'Postre Oriental', d: 'Frutas, helado, charlotte, obleas y cerezas.', p: 16900},
   {n: 'Adicional crema / dulce de leche', p: 2300},
  ]},
 ]},
 {id: 'tragos', t: 'Tragos y whiskey', nav: 'Tragos', img: 'trago', groups: [
  {g: 'Tragos', items: [
   {n: 'Mojito', p: 14500}, {n: 'Campari', p: 14500}, {n: 'Aperol', p: 14500}, {n: 'Negroni', p: 14500},
   {n: 'Gancia', p: 12000}, {n: 'Vermouth', p: 12000}, {n: 'Fernet cordobés', p: 14500}, {n: 'Baileys', p: 18000},
   {n: 'Amarula', p: 19500}, {n: 'Bombay', p: 18000}, {n: 'Gordon\'s', p: 14500}, {n: 'Beefeater', p: 18000},
   {n: 'Tanqueray', p: 18000}, {n: 'Caipiroska', p: 14500}, {n: 'Gin tonic', p: 14500},

  {g: 'Whiskey', items: [

];

// ---------- render ----------
const money = n => '$ ' + n.toLocaleString('es-AR');
const price = (v, label) => `<span class="pr">${label ? `<small>${label}</small>` : ''}${money(v)}</span>`;
const prices = p => p === undefined ? '<span class="ask">Consultar</span>'
  : Array.isArray(p) ? `<span class="pr">${p.map(money).join(' / ')}</span>`
  : typeof p === 'object' ? Object.entries(p).map(([k, v]) => price(v, k)).join('') : price(p);

const item = it => `<li class="it"${Pedido.attr(it.n, it.p, {d: it.d})}>
  <h4>${it.n}</h4>
  <div style="display:flex;gap:14px;align-items:flex-start">${prices(it.p)}</div>
  ${it.d ? `<p>${it.d}</p>` : ''}
</li>`;

const group = g => `<div class="grp">
  ${g.g ? `<h3>${g.g}</h3>` : ''}
  <ul class="items">${g.items.map(item).join('')}</ul>
</div>`;

const section = s => `<section class="sec" id="${s.id}" aria-labelledby="${s.id}-t">
  <img class="orn" src="img/ornamento.webp" alt="" loading="lazy">
  <header class="sec-h"><h2 id="${s.id}-t">${s.t}</h2>${s.img ? `<img class="ic" src="img/${s.img}.webp" alt="" loading="lazy">` : ''}</header>
  ${s.note ? `<p class="note">${s.note}</p>` : ''}
  <div class="cols">${s.groups.map(group).join('')}</div>
</section>`;

document.getElementById('menu').innerHTML = SECS.map(section).join('');
document.getElementById('nav').innerHTML = SECS.map(s => `<li><a href="#${s.id}">${s.nav || s.t}</a></li>`).join('');

// ---------- pedido para el salón (módulo compartido) ----------
Pedido.init({"theme": {"btn": "#550e1f", "btnFg": "#ffffff", "bg": "#fbfaf6", "fg": "#141012", "mute": "#6f6168", "line": "#ebd7ba", "price": "#550e1f", "font": "Poppins,system-ui,sans-serif"}});

// la carta se dibuja con JS: el navegador ya no salta solo al #hash
if (location.hash) document.querySelector(location.hash)?.scrollIntoView();

// ---------- scroll-spy ----------
const navUl = document.getElementById('nav'), links = [...navUl.querySelectorAll('a')];
let current;
const spy = new IntersectionObserver(es => es.forEach(e => {
  const a = links.find(l => l.hash === '#' + e.target.id);
  if (!e.isIntersecting || a === current) return;
  current?.removeAttribute('aria-current');
  a.setAttribute('aria-current', 'true');
  current = a;
  // solo mueve la barra de chips: scrollIntoView también toca el scroll de la página y lo traba
  navUl.scrollTo({left: a.offsetLeft - (navUl.clientWidth - a.offsetWidth) / 2, behavior: 'smooth'});
}), {rootMargin: '-40% 0px -55% 0px'});
document.querySelectorAll('.sec').forEach(s => spy.observe(s));
// salto sin ensuciar el historial (el botón "atrás" vuelve a salir de la carta)
navUl.addEventListener('click', e => {
  const a = e.target.closest('a');
  if (!a) return;
  e.preventDefault();
  document.querySelector(a.hash).scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'});
});
</script>
