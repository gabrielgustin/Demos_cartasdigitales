<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Casa Taza · Carta</title>
<meta name="description" content="Carta de Casa Taza: desayunos, café, pan, pastry, tostones, tortas, sándwiches, brunch, almuerzos y cakes por encargo.">
<meta name="theme-color" content="#f1eae3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700&family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--papel:#f1eae3;--rojo:#ad262e;--naranja:#e0662a;--marron:#5a3a1e;--rosa:#c48aa0;--line:rgba(173,38,46,.22)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:64px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{font-family:Rubik,system-ui,sans-serif;font-weight:400;color:var(--marron);background:var(--papel);-webkit-font-smoothing:antialiased;overflow-x:hidden}
/* el dibujo floral del PDF queda fijo detrás de todo */
body::before{content:"";position:fixed;inset:0;z-index:-1;background:url(img/flores1.webp) center top/min(1100px,150vw) auto repeat-y;opacity:.55;pointer-events:none}
.wrap{max-width:960px;margin:0 auto;padding:0 20px}

/* ---------- portada ---------- */
.hero{position:relative;text-align:center;padding:46px 20px 30px;overflow:hidden}
.hero .mujer{position:absolute;left:50%;top:-10px;width:min(560px,120vw);transform:translateX(-50%);opacity:.9;pointer-events:none}
.hero .cas{position:relative;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:.85rem;letter-spacing:.9em;margin-right:-.9em;color:var(--naranja)}
.hero h1{position:relative;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:clamp(4rem,19vw,7.4rem);line-height:.9;letter-spacing:.04em;color:var(--rojo);text-transform:uppercase;margin-top:8px}
.hero p{position:relative;margin-top:14px;font-weight:500;font-size:.9rem;color:var(--marron)}
.hero .taza{position:relative;display:block;width:54px;height:auto;margin:18px auto 0}

/* ---------- nav ---------- */
.nav{position:sticky;top:0;z-index:20;background:rgba(241,234,227,.94);backdrop-filter:blur(6px);border-top:1px solid var(--line);border-bottom:2px solid var(--rojo)}
.nav ul{display:flex;gap:6px;overflow-x:auto;list-style:none;padding:10px 16px;max-width:960px;margin:0 auto;scrollbar-width:none}
.nav ul::-webkit-scrollbar{display:none}
.nav a{display:block;white-space:nowrap;padding:5px 14px;border:1px solid var(--rojo);border-radius:999px;color:var(--rojo);text-decoration:none;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:1rem;letter-spacing:.06em;text-transform:uppercase}
.nav a[aria-current="true"]{background:var(--rojo);color:#fff}

/* ---------- secciones ---------- */
main{padding-bottom:8px}
.sec{padding:40px 0 10px}
.sec-h{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--rojo);padding-bottom:6px}
.sec-h h2{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:clamp(2.4rem,10vw,3.4rem);line-height:1;color:var(--rojo);text-transform:uppercase}
.sec-h h2 span{font-weight:400;color:var(--rojo)}
.sec-h .hora{margin-bottom:6px;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:1rem;letter-spacing:.04em;color:var(--naranja);text-transform:uppercase}
.nota{margin-top:10px;font-size:.85rem;line-height:1.5;color:var(--naranja);font-weight:500}
.cols{columns:2 400px;column-gap:48px;margin-top:10px}
.grp{break-inside:avoid;margin-bottom:22px}
.grp>h3{margin:14px 0 2px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:1.5rem;color:var(--naranja);text-transform:uppercase;letter-spacing:.02em}
.grp>h3 small{font-family:Rubik;font-weight:400;font-size:.82rem;color:var(--marron);text-transform:none;letter-spacing:0}
.items{list-style:none}
.it{display:grid;grid-template-columns:1fr auto;gap:1px 14px;padding:8px 0;border-bottom:1px solid rgba(90,58,30,.12)}
.it h4{font-weight:500;font-size:.98rem;line-height:1.3}
.it h4 b{font-weight:700}
.it .pr{font-weight:500;white-space:nowrap;text-align:right}
.it .pr small{display:block;font-weight:400;font-size:.66rem;letter-spacing:.04em;text-transform:uppercase;color:var(--naranja)}
.it p{grid-column:1/-1;font-size:.83rem;line-height:1.45;color:#6f4f33}
.it .prices{display:flex;gap:14px;align-items:flex-start}
.mk{display:inline-block;margin-left:6px;vertical-align:1px;font-weight:600;font-size:.62rem;letter-spacing:.04em;color:var(--naranja);text-transform:uppercase;white-space:nowrap}
.mk.v{padding:0 6px;border:1px solid var(--naranja);border-radius:999px}
.ask{font-size:.82rem;font-style:italic;color:var(--naranja)}
.after{margin-top:6px;font-size:.82rem;color:var(--naranja);font-weight:500}

/* desayunos: la torta del PDF de fondo */
.torta{position:absolute;right:-40px;top:70px;width:min(300px,60vw);height:auto;opacity:.6;z-index:0;pointer-events:none}
.sec.des{position:relative;overflow:hidden}
.sec.des>*{position:relative}
.sec.des .torta{position:absolute}

/* cakes: tabla de tamaños */
.tbl{margin-top:14px;width:100%;border-collapse:collapse}
.tbl th{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:1.05rem;color:var(--naranja);text-align:right;padding:6px 8px;position:sticky;top:50px;background:rgba(241,234,227,.96)}
.tbl th:first-child{text-align:left}
.tbl td{padding:9px 8px;border-bottom:1px solid rgba(90,58,30,.12);font-size:.9rem;text-align:right;white-space:nowrap}
.tbl td:first-child{text-align:left;white-space:normal;color:var(--naranja);font-weight:500}
.tbl td small{font-size:.72rem;color:var(--marron)}
.tbl tr:last-child td{border-bottom:0}

footer{padding:34px 20px 48px;text-align:center}
footer img{width:60px;height:auto}
footer p{margin-top:10px;font-size:.78rem;color:var(--marron)}
</style>

const group = g => `<div class="grp">${g.g ? `<h3>${g.g}${g.s ? ` <small>· ${g.s}</small>` : ''}</h3>` : ''}<ul class="items">${g.items.map(item).join('')}</ul></div>`;

const table = t => `<table class="tbl"><thead><tr><th scope="col">Torta</th>${t.cols.map(c => `<th scope="col">${c}</th>`).join('')}</tr></thead><tbody>${
  t.rows.map(r => `<tr${Pedido.attr(r[0], Object.fromEntries(t.cols.map((c, i) => [c, r[i + 1]])))}><td data-pd-slot>${r[0]}</td>${r.slice(1).map(v => `<td>${v == null ? '–' : money(v)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;

const section = s => `<section class="sec${s.cls ? ' ' + s.cls : ''}" id="${s.id}" aria-labelledby="${s.id}-t">
  ${s.torta ? '<img class="torta" src="img/torta.webp" alt="" loading="lazy">' : ''}
  <header class="sec-h"><h2 id="${s.id}-t">${s.t}${s.s ? ` <span>${s.s}</span>` : ''}</h2>${s.hora ? `<span class="hora">${s.hora}</span>` : ''}</header>
  ${s.nota ? `<p class="nota">${s.nota}</p>` : ''}
  ${s.table ? table(s.table) : `<div class="cols">${s.groups.map(group).join('')}</div>`}
</section>`;

document.getElementById('menu').innerHTML = SECS.map(section).join('');
document.getElementById('nav').innerHTML = SECS.map(s => `<li><a href="#${s.id}">${s.nav || s.t}</a></li>`).join('');

// ---------- pedido para el salón (módulo compartido) ----------
Pedido.init({"theme": {"btn": "#ad262e", "btnFg": "#ffffff", "bg": "#f6f0ea", "fg": "#5a3a1e", "mute": "#8a6a4c", "line": "rgba(173,38,46,.22)", "price": "#ad262e", "font": "Rubik,system-ui,sans-serif", "head": "'Barlow Condensed',sans-serif"}});

// la carta se dibuja con JS: el navegador ya no salta solo al #hash
if (location.hash) document.querySelector(location.hash)?.scrollIntoView();

// ---------- scroll-spy ----------
const navUl = document.getElementById('nav'), links = [...navUl.querySelectorAll('a')];
let current;
const spy = new IntersectionObserver(es => es.forEach(e => {
  const a = links.find(l => l.hash === '#' + e.target.id);
  if (!e.isIntersecting || a === current) return;
  current?.removeAttribute('aria-current');
  a.setAttribute('aria-current', 'true');
  current = a;
  // solo mueve la barra de chips: scrollIntoView también toca el scroll de la página y lo traba
  navUl.scrollTo({left: a.offsetLeft - (navUl.clientWidth - a.offsetWidth) / 2, behavior: 'smooth'});
}), {rootMargin: '-40% 0px -55% 0px'});
document.querySelectorAll('.sec').forEach(s => spy.observe(s));
// salto sin ensuciar el historial (el botón "atrás" vuelve a salir de la carta)
navUl.addEventListener('click', e => {
  const a = e.target.closest('a');
  if (!a) return;
  e.preventDefault();
  document.querySelector(a.hash).scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'});
});
</script>
</body>
</html>
