<style>
:root{--ink:#111;--mute:#6f6a72;--plum:#6d3d5f;--pink:#e11d5a;--wine:#7f0a14;--line:#e4dde2}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:70px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{font-family:Montserrat,system-ui,sans-serif;color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px}

/* ---------- portada ---------- */
.hero{text-align:center;padding:34px 16px 22px}
.hero img{display:block;width:min(260px,62vw);height:auto;margin:0 auto}
.hero h1{margin-top:18px;font-weight:900;font-size:clamp(1.6rem,7.4vw,2.6rem);letter-spacing:.3em;margin-right:-.3em;text-transform:uppercase}
.hero h1+i{display:block;width:130px;height:1px;margin:14px auto 0;background:repeating-linear-gradient(90deg,var(--plum) 0 2px,transparent 2px 4px)}
.legend{max-width:560px;margin:16px auto 0;font-size:.78rem;line-height:1.5;color:var(--mute);letter-spacing:.04em}

/* ---------- nav ---------- */
.nav{position:sticky;top:0;z-index:20;background:#fff;border-top:1px solid var(--plum);border-bottom:1px solid var(--plum)}
.nav ul{display:flex;gap:6px;overflow-x:auto;list-style:none;padding:10px 16px;max-width:1040px;margin:0 auto;scrollbar-width:none}
.nav ul::-webkit-scrollbar{display:none}
.nav a{display:block;white-space:nowrap;padding:6px 14px 5px;border:1px solid var(--plum);color:var(--ink);text-decoration:none;font-family:'Bebas Neue';font-size:1.02rem;letter-spacing:.14em}
.nav a[aria-current="true"]{background:var(--ink);border-color:var(--ink);color:#fff}

/* ---------- secciones ---------- */
main{padding:10px 0 8px}
.sec{padding:38px 0 14px;border-bottom:1px solid var(--plum)}
.sec:last-child{border-bottom:0}
.sec>h2{text-align:center;font-weight:900;font-size:clamp(1.35rem,6.2vw,2.1rem);letter-spacing:.22em;margin-right:-.22em;text-transform:uppercase;line-height:1.15}
.sec>h2+i{display:block;width:130px;height:1px;margin:12px auto 0;background:repeating-linear-gradient(90deg,var(--plum) 0 2px,transparent 2px 4px)}
.sub{margin-top:14px;text-align:center;font-family:'Courier New',monospace;font-size:.95rem;letter-spacing:.14em;text-transform:uppercase}
.sec-note{margin:14px auto 0;max-width:620px;text-align:center;font-size:.82rem;line-height:1.5;color:var(--mute);letter-spacing:.04em}
.cols{columns:2 400px;column-gap:48px;margin-top:26px}
.grp{break-inside:avoid;margin-bottom:30px}
.grp>h3{font-family:'Bebas Neue';font-weight:400;font-size:1.65rem;letter-spacing:.14em;line-height:1.1;text-transform:uppercase;border-bottom:2px solid var(--ink);padding-bottom:3px;margin-bottom:6px;display:inline-block}
.grp>.gs{font-size:.78rem;letter-spacing:.08em;color:var(--mute);margin:2px 0 6px;text-transform:uppercase}
.items{list-style:none}
.it{display:grid;grid-template-columns:1fr auto;gap:2px 14px;padding:8px 0}
.it h4{font-family:Oswald;font-weight:300;font-size:1.08rem;letter-spacing:.04em;line-height:1.25;text-transform:uppercase}
.it .prices{display:flex;gap:14px;align-items:flex-start}
.it .pr{font-family:Oswald;font-weight:400;font-size:1.02rem;white-space:nowrap;text-align:right;letter-spacing:.03em}
.it .pr small{display:block;font-family:Montserrat;font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.it .nd{color:var(--pink);font-size:.78rem;font-family:Montserrat;letter-spacing:.06em;text-transform:uppercase}
.it p{grid-column:1/-1;font-size:.74rem;line-height:1.55;letter-spacing:.06em;color:#2b2830}
.tag{display:inline-block;margin-left:8px;vertical-align:2px;font-family:Montserrat;font-weight:500;font-size:.58rem;letter-spacing:.1em;text-transform:uppercase}
.tag.new,.tag.share{color:var(--pink)}
.tag.st{padding:1px 5px;border:1px solid var(--plum);color:var(--plum)}
.it.off h4,.it.off p{color:#a29ca5}
.after{margin-top:6px;font-size:.78rem;letter-spacing:.06em;font-style:italic;color:var(--mute)}

/* vinos: serif y rojo vino, como el PDF de vinos */
.vino>h2{color:var(--wine)}
.vino .grp>h3{font-family:Montserrat;font-weight:900;font-size:1rem;letter-spacing:.06em;border:0;padding:0;margin-bottom:2px}
.vino .it h4{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:1.2rem;letter-spacing:.01em;text-transform:none}
.vino .it .pr{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:1.15rem}

footer{padding:26px 16px 40px;text-align:center;font-size:.72rem;letter-spacing:.06em;color:var(--mute)}
</style>

// ---------- render ----------
const money = n => typeof n === 'number' ? '$ ' + n.toLocaleString('es-AR') : n;
const price = (v, label) => `<span class="pr">${label ? `<small>${label}</small>` : ''}${money(v)}</span>`;
const prices = p => p === undefined ? '' : p === 'nd' ? '<span class="nd">No disponible</span>'
  : typeof p === 'object' ? Object.entries(p).map(([k, v]) => price(v, k)).join('') : price(p);

const item = it => `<li class="it${it.p === 'nd' ? ' off' : ''}"${Pedido.attr(it.n, it.p, {d: it.d})}>
  <h4>${it.n}${it.nw ? '<span class="tag new">Nuevo</span>' : ''}${it.share ? '<span class="tag share">Para compartir</span>' : ''}${it.st ? '<span class="tag st">Sin TACC</span>' : ''}</h4>
  <div class="prices">${prices(it.p)}</div>
  ${it.d ? `<p>${it.d}</p>` : ''}
</li>`;

const group = g => `<div class="grp">
  <h3>${g.g}</h3>${g.s ? `<p class="gs">${g.s}</p>` : ''}
  <ul class="items">${g.items.map(item).join('')}</ul>
  ${g.after ? `<p class="after">${g.after}</p>` : ''}
</div>`;

const section = s => `<section class="sec${s.cls ? ' ' + s.cls : ''}" id="${s.id}" aria-labelledby="${s.id}-t">
  <h2 id="${s.id}-t">${s.t}</h2><i aria-hidden="true"></i>
  ${s.sub ? `<p class="sub">${s.sub}</p>` : ''}${s.note ? `<p class="sec-note">${s.note}</p>` : ''}
  <div class="cols">${s.groups.map(group).join('')}</div>
</section>`;

document.getElementById('menu').innerHTML = SECS.map(section).join('');
document.getElementById('nav').innerHTML = SECS.map(s => `<li><a href="#${s.id}">${s.nav || s.t}</a></li>`).join('');

// ---------- pedido para el salón (módulo compartido) ----------
Pedido.init({"theme": {"btn": "#111111", "btnFg": "#ffffff", "bg": "#ffffff", "fg": "#111111", "mute": "#6f6a72", "line": "#e4dde2", "price": "#6d3d5f", "font": "Montserrat,system-ui,sans-serif", "head": "Oswald,sans-serif"}});

// la carta se dibuja con JS: el navegador ya no salta solo al #hash
if (location.hash) document.querySelector(location.hash)?.scrollIntoView();

// ---------- scroll-spy ----------
const navUl = document.getElementById('nav'), links = [...navUl.querySelectorAll('a')];
let current;
const spy = new IntersectionObserver(es => es.forEach(e => {
  const a = links.find(l => l.hash === '#' + e.target.id);
  if (!e.isIntersecting || a === current) return;
  current?.removeAttribute('aria-current');
  a.setAttribute('aria-current', 'true');
  current = a;
  // solo mueve la barra de chips: scrollIntoView también toca el scroll de la página y lo traba
  navUl.scrollTo({left: a.offsetLeft - (navUl.clientWidth - a.offsetWidth) / 2, behavior: 'smooth'});
}), {rootMargin: '-40% 0px -55% 0px'});
document.querySelectorAll('.sec').forEach(s => spy.observe(s));
// salto sin ensuciar el historial (el botón "atrás" vuelve a salir de la carta)
navUl.addEventListener('click', e => {
  const a = e.target.closest('a');
  if (!a) return;
  e.preventDefault();
  document.querySelector(a.hash).scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'});
});
</script>
