<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aldea Café · Menú</title>
<meta name="description" content="Menú de Aldea Café: café e infusiones, panadería, desayunos y meriendas, minutas, pastas, milanesas, postres y bebidas.">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/pedido.css">
<script src="../shared/pedido.js"></script>
<style>
:root{--teal:#2b4745;--teal-2:#3f6663;--ink:#1c1c1c;--mute:#5c6a69;--line:rgba(43,71,69,.18);--sage:#eef3f1}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:66px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{font-family:Montserrat,system-ui,sans-serif;font-weight:400;color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.wrap{max-width:980px;margin:0 auto;padding:0 20px}

/* ---------- portada ---------- */
.hero{text-align:center;padding:30px 20px 18px}
.hero img{display:block;width:min(230px,56vw);height:auto;margin:0 auto}
.hero p{margin-top:6px;font-weight:500;font-size:.8rem;letter-spacing:.34em;margin-right:-.34em;text-transform:uppercase;color:var(--teal-2)}

/* ---------- nav ---------- */
.nav{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-top:1px solid var(--line);border-bottom:2px solid var(--teal)}
.nav ul{display:flex;gap:6px;overflow-x:auto;list-style:none;padding:10px 16px;max-width:980px;margin:0 auto;scrollbar-width:none}
.nav ul::-webkit-scrollbar{display:none}
.nav a{display:block;white-space:nowrap;padding:6px 14px;border:1px solid var(--teal);border-radius:999px;color:var(--teal);text-decoration:none;font-weight:600;font-size:.74rem;letter-spacing:.06em;text-transform:uppercase}
.nav a[aria-current="true"]{background:var(--teal);color:#fff}

/* ---------- secciones ---------- */
main{padding-bottom:8px}
.sec{padding:40px 0 8px}
.sec>h2{font-weight:800;font-size:clamp(1.5rem,6.4vw,2.1rem);line-height:1.15;color:var(--teal);text-transform:uppercase;letter-spacing:.01em}
.sec>h2::after{content:"";display:block;width:54px;height:3px;margin-top:10px;background:var(--teal-2)}
.nota{margin-top:12px;padding:10px 14px;background:var(--sage);border-left:3px solid var(--teal);font-size:.84rem;line-height:1.55;color:var(--teal);font-weight:500}
.cols{columns:2 400px;column-gap:48px;margin-top:10px}
.grp{break-inside:avoid;margin-bottom:22px}
.grp>h3{margin:16px 0 2px;font-weight:700;font-size:.92rem;letter-spacing:.04em;text-transform:uppercase;color:var(--teal)}
.grp>h3 small{display:block;margin-top:2px;font-weight:500;font-size:.74rem;letter-spacing:0;text-transform:none;color:var(--mute)}
.items{list-style:none}
.it{display:grid;grid-template-columns:1fr auto;gap:2px 14px;padding:9px 0;border-bottom:1px solid var(--line)}
.it h4{font-weight:600;font-size:.88rem;line-height:1.35;text-transform:uppercase;letter-spacing:.01em}
.it .prices{display:flex;gap:14px;align-items:flex-start}
.it .pr{font-weight:600;font-size:.9rem;white-space:nowrap;text-align:right;color:var(--teal)}
.it .pr small{display:block;font-weight:500;font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.it p{grid-column:1/-1;font-size:.8rem;line-height:1.5;color:var(--mute)}

/* ---------- pie con las marcas ---------- */
.marcas{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:16px 30px;margin:44px 0 8px;padding-top:24px;border-top:1px solid var(--line)}
.marcas img{height:44px;width:auto;max-width:112px;object-fit:contain}
footer{padding:12px 20px 40px;text-align:center;font-size:.72rem;color:var(--mute)}
</style>
</head>
<body>

<main class="wrap" id="menu"></main>

  <img src="img/amstel.webp" alt="Amstel" loading="lazy"><img src="img/imperial.webp" alt="Imperial" loading="lazy"><img src="img/heineken.webp" alt="Heineken" loading="lazy">
  <img src="img/carpano.webp" alt="Carpano" loading="lazy"><img src="img/spiritoblu.webp" alt="Spirito Blu" loading="lazy"><img src="img/branca.webp" alt="Branca" loading="lazy">
  <img src="img/sernova.webp" alt="Sernova" loading="lazy"><img src="img/lacelia.webp" alt="Bodega La Celia" loading="lazy">
</div></div>

  {g: 'Papas y rabas', items: [

 {id: 'ejecutivo', t: 'Menú ejecutivo', nav: 'Ejecutivo', groups: [], nota: 'Almuerzo y cena. Incluye plato principal + bebida. Consultá el menú ejecutivo.'},
 {id: 'principales', t: 'Principales', sub: 'Almuerzo y cena', groups: [

// ---------- render ----------
const money = n => '$ ' + n.toLocaleString('es-AR');
const price = (v, label) => `<span class="pr">${label ? `<small>${label}</small>` : ''}${money(v)}</span>`;
const prices = p => typeof p === 'object' ? Object.entries(p).map(([k, v]) => price(v, k)).join('') : price(p);
const item = it => `<li class="it"${Pedido.attr(it.n, it.p, {d: it.d})}><h4>${it.n}</h4><div class="prices">${prices(it.p)}</div>${it.d ? `<p>${it.d}</p>` : ''}</li>`;
const group = g => `<div class="grp">${g.g ? `<h3>${g.g}${g.s ? `<small>${g.s}</small>` : ''}</h3>` : ''}<ul class="items">${g.items.map(item).join('')}</ul></div>`;
const section = s => `<section class="sec" id="${s.id}" aria-labelledby="${s.id}-t">
  <h2 id="${s.id}-t">${s.t}</h2>${s.sub ? `<p class="nota" style="border:0;background:none;padding:6px 0 0;color:var(--mute)">${s.sub}</p>` : ''}
  ${s.nota ? `<p class="nota">${s.nota}</p>` : ''}
  <div class="cols">${s.groups.map(group).join('')}</div>
</section>`;

document.getElementById('menu').innerHTML = SECS.map(section).join('');
document.getElementById('nav').innerHTML = SECS.map(s => `<li><a href="#${s.id}">${s.nav || s.t}</a></li>`).join('');

// ---------- pedido para el salón (módulo compartido) ----------
Pedido.init({theme: {btn: '#2b4745', btnFg: '#ffffff', bg: '#ffffff', fg: '#1c1c1c', mute: '#5c6a69', line: 'rgba(43,71,69,.18)', price: '#2b4745', font: 'Montserrat,system-ui,sans-serif'}});

// la carta se dibuja con JS: el navegador ya no salta solo al #hash
if (location.hash) document.querySelector(location.hash)?.scrollIntoView();

// ---------- scroll-spy ----------
const navUl = document.getElementById('nav'), links = [...navUl.querySelectorAll('a')];
let current;
const spy = new IntersectionObserver(es => es.forEach(e => {
  const a = links.find(l => l.hash === '#' + e.target.id);
  if (!e.isIntersecting || a === current) return;
  current?.removeAttribute('aria-current');
  a.setAttribute('aria-current', 'true');
  current = a;
  // solo mueve la barra de chips: scrollIntoView también toca el scroll de la página y lo traba
  navUl.scrollTo({left: a.offsetLeft - (navUl.clientWidth - a.offsetWidth) / 2, behavior: 'smooth'});
}), {rootMargin: '-40% 0px -55% 0px'});
document.querySelectorAll('.sec').forEach(s => spy.observe(s));
// salto sin ensuciar el historial (el botón "atrás" vuelve a salir de la carta)
navUl.addEventListener('click', e => {
  const a = e.target.closest('a');
  if (!a) return;
  e.preventDefault();
  document.querySelector(a.hash).scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'});
});
</script>

</html>
